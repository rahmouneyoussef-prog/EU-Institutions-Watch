  # resulting URL below. You mentioned already having a Maroc / Western
  # Sahara EUR-Lex tracker - reuse that feed URL here.
  - name: "EUR-Lex - Custom search alert"
    url: "PASTE_YOUR_EURLEX_RSS_ALERT_URL_HERE"
